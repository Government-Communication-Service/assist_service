[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
testpaths = tests
norecursedirs = tests/evals
# Quiet by default: a dot per test, then for each failure its traceback and captured logs, a one-line
# summary of every test that didn't pass, and the slowest tests. For more detail, add -v (list each
# test), -s (show print output) or -o log_cli=true (stream logs live, at log_cli_level).
addopts = -q -ra --durations=10 --durations-min=1.0
log_cli_level = INFO
filterwarnings =
    ignore:.*:DeprecationWarning
    ignore:Field "model_name" has conflict with protected namespace "model_".*:UserWarning
    ignore:Field "model_info" has conflict with protected namespace "model_".*:UserWarning
    ignore::pytest.PytestConfigWarning
markers =
    general: marks tests using general functionality
    e2e: marks tests using end to end testing
    unit: marks unit tests
    streaming: marks tests using streaming
    rag: marks tests using rag
    chat: marks tests using chat
    prompts: marks tests using prompts
    messages: marks tests using messages
    auth: marks tests using authentication
    opensearch: marks tests related to OpenSearch
    integration: marks integration tests
    audience_segments: marks tests for audience segments
    chat_share: marks tests for chat sharing functionality
    document_upload: marks tests for document upload functionality
    projects: marks tests for project folders functionality

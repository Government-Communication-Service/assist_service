# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Tests

on:
  pull_request:
    branches:
      - '*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-22.04
    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: test_db
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      AUTH_SECRET_KEY: ${{ secrets.AUTH_SECRET_KEY }}
      AUTH_SECRET_KEY_2: ${{ secrets.AUTH_SECRET_KEY_2 }}
      BUGSNAG_API_KEY: ${{ secrets.BUGSNAG_API_KEY }}
      BUGSNAG_RELEASE_STAGE: copilot-dev-github-actions
      USE_RAG: ${{ secrets.USE_RAG }}
      # The tests mock AWS and OpenSearch (see tests/conftest.py), so no AWS or OpenSearch secrets are needed.
      # The app's config still requires an OpenSearch password to load.
      OPENSEARCH_MOCKED: "true"
      OPENSEARCH_PASSWORD: unused-in-tests
      LLM_USE_BEDROCK: "true"
      SHOW_DETAILED_ERROR_MESSAGES: "true"

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Clone repository
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils pandoc tar file libmagic-dev libgl1-mesa-glx
          sudo apt-get clean

      - name: Install python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt
          pip install pytest-cov

      - name: Run Alembic Migrations
        run: |
          cd app/alembic
          alembic upgrade head

      # Output options are in pytest.ini. Coverage is summarised by the next step, with the full HTML report
      # in the test-reports artifact.
      - name: Run tests
        run: |
          pytest -n logical --dist loadscope --tb=short --cov=app --cov-report= --cov-report=xml:test-output/coverage.xml --cov-report=html:test-output/coverage-html --junit-xml=test-output/test-output.xml

      - name: Summarise test results
        if: ${{ !cancelled() }}
        run: python scripts/ci/test_summary.py test-output/test-output.xml test-output/coverage.xml

      - name: Persist test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: ./test-output/
